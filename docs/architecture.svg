<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" width="960" height="960" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="960" height="960" fill="#ffffff"/>

  <text x="32" y="44" font-size="22" font-weight="700" fill="#0f172a">After: how a message finds its agent</text>
  <text x="32" y="70" font-size="15" fill="#475569">The main agent sees about 12 relevant agents per message, not every agent ever created.</text>

  <!-- ===== Left column: the path of one message ===== -->
  <!-- 1 -->
  <rect x="32" y="100" width="560" height="78" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <circle cx="60" cy="128" r="14" fill="#64748b"/><text x="60" y="133" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">1</text>
  <text x="84" y="134" font-size="17" font-weight="700" fill="#0f172a">Your message</text>
  <text x="84" y="160" font-size="14.5" fill="#1e293b">"Did Sarah Okafor reply about the offer?"  (or an email, with its thread id)</text>

  <!-- 2 -->
  <rect x="32" y="206" width="560" height="168" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="60" cy="234" r="14" fill="#2563eb"/><text x="60" y="239" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">2</text>
  <text x="84" y="240" font-size="17" font-weight="700" fill="#1e3a8a">Retriever</text>
  <text x="180" y="240" font-size="13.5" fill="#475569">retrieval.py</text>
  <g font-size="14.5" fill="#1e293b">
    <text x="84" y="266">An exact email or thread match wins. Otherwise keyword search (BM25)</text>
    <text x="84" y="286">over name, summary, contacts, search phrases and last 20 requests,</text>
    <text x="84" y="306">plus search by meaning with a small local model. Typo hints for names.</text>
  </g>
  <rect x="84" y="320" width="490" height="38" rx="8" fill="#dbeafe"/>
  <text x="100" y="344" font-size="14.5" font-weight="700" fill="#1e3a8a">Shortlist: 8 found + 4 recently used + that person's other agents</text>

  <!-- 3 -->
  <rect x="32" y="402" width="560" height="104" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <circle cx="60" cy="430" r="14" fill="#7c3aed"/><text x="60" y="435" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">3</text>
  <text x="84" y="436" font-size="17" font-weight="700" fill="#5b21b6">Main agent (LLM)</text>
  <g font-size="14.5" fill="#1e293b">
    <text x="84" y="462">Sees the shortlist, each with its summary and why it matched.</text>
    <text x="84" y="482">Hands the task to one, searches further with search_agents,</text>
    <text x="84" y="500">or asks "Which Sarah?" when it can't tell.</text>
  </g>

  <!-- 4 -->
  <rect x="32" y="534" width="560" height="104" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <circle cx="60" cy="562" r="14" fill="#ea580c"/><text x="60" y="567" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">4</text>
  <text x="84" y="568" font-size="17" font-weight="700" fill="#c2410c">Resolver</text>
  <text x="170" y="568" font-size="13.5" fill="#475569">resolver.py</text>
  <g font-size="14.5" fill="#1e293b">
    <text x="84" y="594">Same name, thread or email: reuse that agent. Similar wording alone</text>
    <text x="84" y="614">never merges. new_task marks a new topic with a known person.</text>
    <text x="84" y="632" font-size="13.5" fill="#475569">Every decision is written to the routing log.</text>
  </g>

  <!-- 5 -->
  <rect x="32" y="666" width="560" height="104" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <circle cx="60" cy="694" r="14" fill="#059669"/><text x="60" y="699" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">5</text>
  <text x="84" y="700" font-size="17" font-weight="700" fill="#047857">Execution agent</text>
  <g font-size="14.5" fill="#1e293b">
    <text x="84" y="726">Does the work: email, reminders, searches. One run at a time per</text>
    <text x="84" y="746">agent. Sees its last 10 requests and a summary, not its whole log.</text>
    <text x="84" y="764" font-size="13.5" fill="#475569">Sends email only after you saw the draft and replied (send guard).</text>
  </g>

  <!-- 6 -->
  <rect x="32" y="798" width="560" height="84" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
  <circle cx="60" cy="826" r="14" fill="#0891b2"/><text x="60" y="831" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">6</text>
  <text x="84" y="832" font-size="17" font-weight="700" fill="#0e7490">After each run</text>
  <text x="84" y="858" font-size="14.5" fill="#1e293b">Summary rebuilt from the log; a cheap model writes ~10 search phrases.</text>

  <!-- down arrows -->
  <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)">
    <line x1="312" y1="178" x2="312" y2="202"/>
    <line x1="312" y1="374" x2="312" y2="398"/>
    <line x1="312" y1="506" x2="312" y2="530"/>
    <line x1="312" y1="638" x2="312" y2="662"/>
    <line x1="312" y1="770" x2="312" y2="794"/>
  </g>

  <!-- ===== Right column: the registry ===== -->
  <path d="M 660 222 a 135 16 0 0 1 270 0 v 640 a 135 16 0 0 1 -270 0 z" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <ellipse cx="795" cy="222" rx="135" ry="16" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
  <text x="795" y="268" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">Agent registry</text>
  <text x="795" y="290" font-size="14" fill="#475569" text-anchor="middle">SQLite, registry.py</text>
  <text x="684" y="326" font-size="14" font-weight="600" fill="#0f172a">One row per agent:</text>
  <g font-size="14" fill="#1e293b">
    <text x="684" y="352">• name and summary</text>
    <text x="684" y="376">• contacts and emails</text>
    <text x="684" y="400">• Gmail thread ids</text>
    <text x="684" y="424">• search phrases</text>
    <text x="684" y="448">• last 20 requests</text>
    <text x="684" y="472">• meaning vectors (once)</text>
    <text x="684" y="496">• status and last use</text>
  </g>
  <text x="684" y="532" font-size="13" fill="#64748b">The original kept only a</text>
  <text x="684" y="550" font-size="13" fill="#64748b">list of names.</text>

  <rect x="676" y="732" width="238" height="112" rx="10" fill="#fefce8" stroke="#a16207" stroke-width="1.5"/>
  <text x="692" y="758" font-size="15.5" font-weight="700" fill="#a16207">Lifecycle</text>
  <g font-size="13.5" fill="#1e293b">
    <text x="692" y="782">Idle 14 days: dormant.</text>
    <text x="692" y="802">Idle 45 days: archived.</text>
    <text x="692" y="822">Nothing is deleted; archived</text>
    <text x="692" y="840">agents stay searchable.</text>
  </g>

  <!-- registry links -->
  <g stroke="#475569" stroke-width="2" fill="none">
    <line x1="657" y1="300" x2="596" y2="300" marker-end="url(#a)"/>
    <line x1="598" y1="454" x2="655" y2="454" stroke-dasharray="6 5" marker-start="url(#a)" marker-end="url(#a)"/>
    <line x1="596" y1="586" x2="655" y2="586" marker-end="url(#a)"/>
    <line x1="596" y1="840" x2="655" y2="840" marker-end="url(#a)"/>
  </g>
  <g font-size="12.5" fill="#475569">
    <text x="604" y="292">reads</text>
    <text x="602" y="446">search</text>
    <text x="602" y="578">writes</text>
    <text x="602" y="832">updates</text>
  </g>

  <text x="32" y="930" font-size="14" fill="#475569">Real model, 300 agents: right on 46 of 46 cases (original 24), 0 duplicate agents (original 33%),</text>
  <text x="32" y="950" font-size="14" fill="#475569">and about 1,000 tokens of agents per prompt at any roster size (original: 10,700 at 1000 agents).</text>
</svg>
